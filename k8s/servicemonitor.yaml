apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: employee-management
  namespace: monitoring
  label:
    app: employee-management
spec:
  selector:
    matchLabels:
      app: employee-management
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
