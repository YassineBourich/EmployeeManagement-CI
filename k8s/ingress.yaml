apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /Employee-Management/?(.*)
            pathType: Prefix
            backend:
              service:
                name: employee-app
                port:
                  number: 80
