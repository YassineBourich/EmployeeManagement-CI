apiVersion: v1
kind: Service
metadata:
  name: employee-management
  namespace: default
  labels:
    app: employee-management
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app: employee-management
  ports:
    - name: http
      port: 80
      targetPort: 8080
